name: Numelixa Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Add Numelixa native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/numelixa/app
          cat > android/app/src/main/java/com/numelixa/app/NumelixaUpdateService.java <<'JAVA'
          package com.numelixa.app;
          import android.app.*;
          import android.content.*;
          import android.os.*;
          import androidx.core.app.NotificationCompat;
          import java.io.*;
          import java.net.*;
          
          public class NumelixaUpdateService extends Service{
           private static final String P="numelixa_update",CH="numelixa_update";private static final int ID=4207;
           public void onCreate(){super.onCreate();if(Build.VERSION.SDK_INT>=26){NotificationChannel c=new NotificationChannel(CH,"Numelixa updates",NotificationManager.IMPORTANCE_LOW);getSystemService(NotificationManager.class).createNotificationChannel(c);}}
           private void save(String s,long g,long t,String e){getSharedPreferences(P,MODE_PRIVATE).edit().putString("status",s).putLong("downloaded",g).putLong("total",t).putString("error",e==null?"":e).apply();}
           private Notification note(long g,long t,boolean done){NotificationCompat.Builder b=new NotificationCompat.Builder(this,CH).setSmallIcon(android.R.drawable.stat_sys_download).setContentTitle(done?"Numelixa update ready":"Numelixa update").setContentText(done?"Download complete":"Downloading the latest Numelixa update").setOngoing(!done).setOnlyAlertOnce(true).setPriority(NotificationCompat.PRIORITY_LOW);if(t>0)b.setProgress((int)Math.min(Integer.MAX_VALUE,t),(int)Math.min(Integer.MAX_VALUE,g),false);else b.setProgress(0,0,true);return b.build();}
           public int onStartCommand(Intent i,int f,int id){startForeground(ID,note(0,0,false));new Thread(()->download(i.getStringExtra("url"),i.getStringExtra("file"),i.getStringExtra("part"))).start();return START_NOT_STICKY;}
           private void download(String us,String tp,String pp){HttpURLConnection c=null;long g=0,t=0;try{File target=new File(tp),part=new File(pp);if(part.exists())part.delete();c=(HttpURLConnection)new URL(us).openConnection();c.setInstanceFollowRedirects(true);c.setConnectTimeout(30000);c.setReadTimeout(30000);c.setRequestProperty("User-Agent","Numelixa-Android-Updater");int code=c.getResponseCode();if(code<200||code>=300)throw new Exception("HTTP "+code);t=c.getContentLengthLong();getSharedPreferences(P,MODE_PRIVATE).edit().putLong("total",Math.max(0,t)).apply();try(InputStream in=c.getInputStream();FileOutputStream out=new FileOutputStream(part)){byte[] b=new byte[65536];int n;long last=0;while((n=in.read(b))!=-1){out.write(b,0,n);g+=n;long now=System.currentTimeMillis();if(now-last>250){save("downloading",g,t,null);((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).notify(ID,note(g,t,false));last=now;}}out.getFD().sync();}if(target.exists())target.delete();if(!part.renameTo(target))throw new Exception("Unable to finalize APK file");save("completed",g,t,null);((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).notify(ID,note(g,t,true));stopForeground(false);stopSelf();}catch(Exception e){save("failed",g,t,e.getMessage());NotificationCompat.Builder b=new NotificationCompat.Builder(this,CH).setSmallIcon(android.R.drawable.stat_notify_error).setContentTitle("Numelixa update failed").setContentText(e.getMessage()==null?"Download failed":e.getMessage()).setAutoCancel(true).setPriority(NotificationCompat.PRIORITY_LOW);((NotificationManager)getSystemService(NOTIFICATION_SERVICE)).notify(ID,b.build());stopForeground(true);stopSelf();}finally{if(c!=null)c.disconnect();}}
           public IBinder onBind(Intent i){return null;}
          }
          JAVA
          cat > android/app/src/main/java/com/numelixa/app/NumelixaUpdaterPlugin.java <<'JAVA'
          package com.numelixa.app;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Environment;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.File;
          
          @CapacitorPlugin(name = "NumelixaUpdater")
          public class NumelixaUpdaterPlugin extends Plugin {
           private static final String P="numelixa_update";
           private android.content.SharedPreferences p(){return getContext().getSharedPreferences(P,Context.MODE_PRIVATE);}
           @PluginMethod public void installApk(PluginCall c){
            String url=c.getString("url"), name=c.getString("fileName","Numelixa-update.apk");
            if(url==null||!url.startsWith("https://")){c.reject("Invalid update URL");return;}
            try{
             if("downloading".equals(p().getString("status","idle"))){JSObject o=new JSObject();o.put("started",true);c.resolve(o);return;}
             File d=getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS); if(d==null)throw new Exception("Download directory unavailable");
             if(!d.exists()&&!d.mkdirs())throw new Exception("Unable to create download directory");
             File target=new File(d,name), part=new File(d,name+".part");
             p().edit().putString("status","downloading").putLong("downloaded",0).putLong("total",0).putString("file",target.getAbsolutePath()).remove("error").apply();
             Intent i=new Intent(getContext(),NumelixaUpdateService.class);i.putExtra("url",url);i.putExtra("file",target.getAbsolutePath());i.putExtra("part",part.getAbsolutePath());
             if(android.os.Build.VERSION.SDK_INT>=26)getContext().startForegroundService(i);else getContext().startService(i);
             JSObject o=new JSObject();o.put("started",true);c.resolve(o);
            }catch(Exception e){c.reject("Unable to start update: "+e.getMessage(),e);}
           }
           @PluginMethod public void getDownloadProgress(PluginCall c){
            JSObject o=new JSObject();String st=p().getString("status","idle");long got=Math.max(0,p().getLong("downloaded",0)),tot=Math.max(0,p().getLong("total",0));double pct=tot>0?Math.min(100,got*100.0/tot):0;
            o.put("status",st);o.put("downloadedBytes",got);o.put("totalBytes",tot);o.put("percent",pct);o.put("mbDownloaded",got/1048576.0);o.put("mbTotal",tot/1048576.0);o.put("notification",p().getString("error",st.equals("completed")?"Update downloaded":"Downloading Numelixa update"));c.resolve(o);
           }
           @PluginMethod public void openDownloadedApk(PluginCall c){
            try{String path=p().getString("file",null);if(path==null)throw new Exception("No downloaded update");File f=new File(path);if(!f.exists())throw new Exception("Downloaded update file is unavailable");Uri u=FileProvider.getUriForFile(getContext(),getContext().getPackageName()+".fileprovider",f);Intent i=new Intent(Intent.ACTION_VIEW);i.setDataAndType(u,"application/vnd.android.package-archive");i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_GRANT_READ_URI_PERMISSION);getActivity().startActivity(i);JSObject o=new JSObject();o.put("opened",true);c.resolve(o);}catch(Exception e){c.reject("Unable to open downloaded update: "+e.getMessage(),e);}
           }
          }
          JAVA
          cat > android/app/src/main/java/com/numelixa/app/MainActivity.java <<'JAVA'
          package com.numelixa.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity{
           @Override public void onCreate(Bundle b){registerPlugin(NumelixaUpdaterPlugin.class);super.onCreate(b);if(Build.VERSION.SDK_INT>=33&&checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED)requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7001);}
          }
          JAVA
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("    <application", '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n\\n    <application', 1)
          p.write_text(s)
          from pathlib import Path
          x=Path("android/app/src/main/res/xml")
          x.mkdir(parents=True,exist_ok=True)
          Path("android/app/src/main/res/xml/numelixa_file_paths.xml").write_text('''<paths xmlns:android="http://schemas.android.com/apk/res/android">
    <external-files-path name="numelixa_updates" path="Download/" />
</paths>''')
          PY
      - name: Configure Firebase push messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          
          root_text = root.read_text()
          app_text = app.read_text()
          
          # Capacitor generates the Android project during CI, so Firebase's
          # Google Services plugin must be attached after cap add android.
          if "com.google.gms:google-services:" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(
                  marker,
                  marker + "\n        classpath 'com.google.gms:google-services:4.5.0'",
                  1
              )
          
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          
          root.write_text(root_text)
          app.write_text(app_text)
          PY
          echo "Firebase Android configuration and Google Services plugin installed."
      - name: Generate Numelixa launcher icons
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Numelixa.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Numelixa-Android-test
          path: Numelixa.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest installable APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Numelixa Android App (Latest)
          prerelease: false
          make_latest: true
          files: Numelixa.apk
          generate_release_notes: false

  signed-release:
    name: Build signed production APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
      - name: Install dependencies and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Add Numelixa native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/numelixa/app
          cat > android/app/src/main/java/com/numelixa/app/NumelixaUpdateService.java <<'JAVA'
          package com.numelixa.app;
          import android.app.*;
          import android.content.*;
          import android.os.*;
