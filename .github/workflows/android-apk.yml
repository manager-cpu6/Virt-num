name: Numelixa Android APK

on:
  push:
    branches: [main, redesign/android-premium-fcm-audit, redesign/complete-auth-services-push, fix/native-google-account-chooser]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: numelixa-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: |
          npm install
          echo "Resolved Capacitor package versions:"
          npm ls @capacitor/core @capacitor/android @capacitor/cli --depth=0
          echo "Full @capacitor/core tree:"
          npm ls @capacitor/core --all
          node - <<'NODE'
          const fs = require('fs');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const entries = Object.entries(lock.packages || {})
            .filter(([path]) => path.endsWith('node_modules/@capacitor/core'))
            .map(([path, value]) => ({ path, version: value.version }));
          console.log('Lockfile @capacitor/core entries:', JSON.stringify(entries));
          if (entries.length !== 1 || entries[0].version !== '7.6.9') {
            throw new Error('Expected exactly one @capacitor/core@7.6.9 installation in lockfile');
          }
          NODE
      - name: Generate Android project and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Configure reliable native Android bridge
        run: python scripts/configure-android-native.py
      - name: Configure Firebase push messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          
          root_text = root.read_text()
          app_text = app.read_text()
          
          # Capacitor generates the Android project during CI, so Firebase's
          # Google Services plugin must be attached after cap add android.
          if "com.google.gms:google-services:" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(
                  marker,
                  marker + "\n        classpath 'com.google.gms:google-services:4.5.0'",
                  1
              )
          
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          
          # capgo social login requests androidx.browser 1.9.0, while the
          # generated Android Browser Helper pins 1.4.0 with strict consistency.
          # Force a single compatible version for the generated app and plugins.
          if "resolutionStrategy.force 'androidx.browser:browser:1.8.0'" not in app_text:
              app_text = app_text.rstrip() + "\n\nconfigurations.configureEach {\n    resolutionStrategy.force 'androidx.browser:browser:1.8.0'\n}\n"
          
          root.write_text(root_text)
          app.write_text(app_text)
          PY
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("android/app/google-services.json").read_text())
          info = cfg.get("project_info", {})
          assert info.get("project_id") == "numelixa", f"Wrong Firebase project: {info.get('project_id')}"
          assert str(info.get("project_number")) == "832390289699", "Firebase project number mismatch"
          assert any(
              c.get("client_info", {}).get("android_client_info", {}).get("package_name") == "com.numelixa.app"
              and c.get("client_info", {}).get("mobilesdk_app_id") == "1:832390289699:android:963bd5705215947fb51496"
              for c in cfg.get("client", [])
          ), "Expected Numelixa Android Firebase app missing"
          print("PASS: google-services.json belongs to Firebase project numelixa / com.numelixa.app")
          PY
          echo "Firebase Android configuration and Google Services plugin installed."
      - name: Generate Numelixa launcher icons
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Verify generated launcher and native plugin bridge
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          ns = {"android": "http://schemas.android.com/apk/res/android"}
          manifest = ET.parse("android/app/src/main/AndroidManifest.xml").getroot()
          launcher = []
          for activity in manifest.findall(".//activity", ns):
              for intent in activity.findall("intent-filter", ns):
                  actions = [n.get("{http://schemas.android.com/apk/res/android}name") for n in intent.findall("action", ns)]
                  categories = [n.get("{http://schemas.android.com/apk/res/android}name") for n in intent.findall("category", ns)]
                  if "android.intent.action.MAIN" in actions and "android.intent.category.LAUNCHER" in categories:
                      launcher.append(activity.get("{http://schemas.android.com/apk/res/android}name"))
          assert launcher, "No MAIN/LAUNCHER Activity in generated manifest"
          assert any(name and name.endswith(".MainActivity") for name in launcher), f"Unexpected launcher Activity: {launcher}"
          activity = Path("android/app/src/main/java/com/numelixa/app/MainActivity.java").read_text()
          plugin = Path("plugins/numelixa-google-sign-in/android/src/main/java/com/numelixa/app/NumelixaGoogleSignInPlugin.java").read_text()
          assert "extends BridgeActivity" in activity, "MainActivity does not extend BridgeActivity"
          assert "registerPlugin(NumelixaGoogleSignInPlugin.class);" not in activity, "Duplicate manual registration remains; plugin must use generated PluginManager metadata"
          import json
          registry = json.loads(Path("android/app/src/main/assets/capacitor.plugins.json").read_text())
          assert any(item.get("classpath") == "com.numelixa.app.NumelixaGoogleSignInPlugin" for item in registry), "Capacitor PluginManager metadata missing native Google plugin"
          assert "NUMELIXA_PLUGIN_REGISTER_START" in activity and "NUMELIXA_PLUGIN_FOUND=" in activity, "Runtime diagnostics missing"
          assert '@CapacitorPlugin(name = "NumelixaGoogleSignIn")' in plugin, "Native plugin name mismatch"
          assert '@PluginMethod' in plugin and 'void signIn(PluginCall call)' in plugin, "Native method mismatch"
          print("Launcher Activity:", launcher)
          print("PASS: launcher, actual BridgeActivity registration, plugin name, signIn method")
          PY
      - name: Verify Firebase Messaging dependency graph
        working-directory: android
        run: |
          ./gradlew app:dependencies --configuration debugRuntimeClasspath > /tmp/numelixa-gradle-deps.txt
          grep -E 'com.google.firebase:firebase-messaging' /tmp/numelixa-gradle-deps.txt
          grep -E 'com.google.gms.google-services' app/build.gradle
          grep -E 'firebase_messaging_auto_init_enabled|POST_NOTIFICATIONS' app/src/main/AndroidManifest.xml
          echo "PASS: Firebase Messaging is present in the resolved Android dependency graph"
      - name: Build debug APK
        working-directory: android
        run: ./gradlew clean assembleDebug
      - name: Verify native Google Sign-In is in the APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          python - <<'PY'
          from pathlib import Path
          import json
          plugin = Path("plugins/numelixa-google-sign-in/android/src/main/java/com/numelixa/app/NumelixaGoogleSignInPlugin.java").read_text()
          activity = Path("android/app/src/main/java/com/numelixa/app/MainActivity.java").read_text()
          gradle = Path("plugins/numelixa-google-sign-in/android/build.gradle").read_text()
          assert '@CapacitorPlugin(name = "NumelixaGoogleSignIn")' in plugin, "plugin annotation missing"
          assert "registerPlugin(NumelixaGoogleSignInPlugin.class);" not in activity, "Google plugin must be discovered from Capacitor metadata, not manually registered"
          assert "androidx.credentials:credentials:" in gradle, "Credential Manager dependency missing from plugin module"
          plugin_package = json.loads(Path("plugins/numelixa-google-sign-in/package.json").read_text())
          assert plugin_package.get("capacitor", {}).get("android", {}).get("src") == "android", "Local Capacitor plugin metadata missing"
          assert "registerPlugin('NumelixaGoogleSignIn')" in Path("plugins/numelixa-google-sign-in/index.js").read_text(), "Local plugin JS registration missing"
          assert "Browser.open" not in Path("components/GoogleSignIn.tsx").read_text(), "browser-only sign-in path found"
          print("PASS: source, Capacitor registration, dependencies, and no Browser.open in GoogleSignIn.tsx")
          PY
          APKANALYZER="$(find "$ANDROID_HOME" -type f -name apkanalyzer -print -quit)"
          if [ -z "$APKANALYZER" ]; then echo "apkanalyzer was not found in Android SDK"; exit 1; fi
          "$APKANALYZER" dex packages --defined-only "$APK" > /tmp/numelixa-apk-dex.txt
          if ! grep -q 'com.google.firebase.messaging' /tmp/numelixa-apk-dex.txt; then
            echo "ERROR: Firebase Messaging classes are absent from compiled APK dex"
            cat /tmp/numelixa-apk-dex.txt
            exit 1
          fi
          grep 'com.google.firebase.messaging' /tmp/numelixa-apk-dex.txt | head -5
          if ! grep -q 'NumelixaPushTokenPlugin' /tmp/numelixa-apk-dex.txt; then
            echo "ERROR: NumelixaPushTokenPlugin is absent from compiled APK dex"
            cat /tmp/numelixa-apk-dex.txt
            exit 1
          fi
          if ! grep -q 'NumelixaGoogleSignInPlugin' /tmp/numelixa-apk-dex.txt; then
            echo "ERROR: NumelixaGoogleSignInPlugin is absent from compiled APK dex"
            cat /tmp/numelixa-apk-dex.txt
            exit 1
          fi
          grep 'NumelixaGoogleSignInPlugin' /tmp/numelixa-apk-dex.txt
          echo "PASS: final APK dex contains NumelixaGoogleSignInPlugin"
      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Numelixa.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Numelixa-Android-test
          path: Numelixa.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest installable APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Numelixa Android App (Latest)
          prerelease: false
          make_latest: true
          files: Numelixa.apk
          generate_release_notes: false

  signed-release:
    name: Build signed production APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
      - name: Install dependencies and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Configure reliable native Android bridge
        run: python scripts/configure-android-native.py
      - name: Configure Firebase push messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          app_text = app.read_text()
          
          if "com.google.gms:google-services:" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(
                  marker,
                  marker + "\n        classpath 'com.google.gms:google-services:4.5.0'",
                  1
              )
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          
          # Keep browser dependency compatible with generated AGP 8.7.2 / compileSdk 35.
          if "resolutionStrategy.force 'androidx.browser:browser:1.8.0'" not in app_text:
              app_text = app_text.rstrip() + "\n\nconfigurations.configureEach {\n    resolutionStrategy.force 'androidx.browser:browser:1.8.0'\n}\n"
          
          root.write_text(root_text)
          app.write_text(app_text)
          PY
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/numelixa-release.jks
          cat >> android/gradle.properties <<EOF
          NUMELIXA_STORE_FILE=../numelixa-release.jks
          NUMELIXA_KEY_ALIAS=$KEY_ALIAS
          NUMELIXA_STORE_PASSWORD=$KEYSTORE_PASSWORD
          NUMELIXA_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          block = """    signingConfigs {
                  release {
                      storeFile file(project.property("NUMELIXA_STORE_FILE"))
                      storePassword project.property("NUMELIXA_STORE_PASSWORD")
                      keyAlias project.property("NUMELIXA_KEY_ALIAS")
                      keyPassword project.property("NUMELIXA_KEY_PASSWORD")
                  }
              }

          """
          if marker not in s:
              raise SystemExit("Could not locate Android buildTypes for release signing")
          s = s.replace(marker, block + marker, 1)
          s = s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Rename release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Numelixa.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: Numelixa Android ${{ github.ref_name }}
          files: Numelixa.apk
          generate_release_notes: true
