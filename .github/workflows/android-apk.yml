            JSObject o=new JSObject();String st=p().getString("status","idle");long got=Math.max(0,p().getLong("downloaded",0)),tot=Math.max(0,p().getLong("total",0));double pct=tot>0?Math.min(100,got*100.0/tot):0;
            o.put("status",st);o.put("downloadedBytes",got);o.put("totalBytes",tot);o.put("percent",pct);o.put("mbDownloaded",got/1048576.0);o.put("mbTotal",tot/1048576.0);o.put("notification",p().getString("error",st.equals("completed")?"Update downloaded":"Downloading Numelixa update"));c.resolve(o);
           }
