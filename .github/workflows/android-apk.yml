name: Numelixa Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Add Numelixa native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/numelixa/app
          cat > android/app/src/main/java/com/numelixa/app/NumelixaUpdaterPlugin.java <<'JAVA'
          package com.numelixa.app;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          
          @CapacitorPlugin(name = "NumelixaUpdater")
          public class NumelixaUpdaterPlugin extends Plugin {
              private static final String PREFS="numelixa_update";
              private static final String DOWNLOAD_ID="download_id";
              private long savedId(){ return getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).getLong(DOWNLOAD_ID,-1); }
              private void saveId(long id){ getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).edit().putLong(DOWNLOAD_ID,id).apply(); }
          
              @PluginMethod public void installApk(PluginCall call) {
                  String url=call.getString("url"); String fileName=call.getString("fileName","Numelixa-update.apk");
                  if(url==null||!url.startsWith("https://")){call.reject("Invalid update URL");return;}
                  try{
                      DownloadManager manager=(DownloadManager)getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      long existing=savedId();
                      if(existing>0){
                          android.database.Cursor q=manager.query(new DownloadManager.Query().setFilterById(existing));
                          if(q!=null){try{if(q.moveToFirst()){
                              int st=q.getInt(q.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                              if(st==DownloadManager.STATUS_RUNNING||st==DownloadManager.STATUS_PENDING||st==DownloadManager.STATUS_PAUSED){
                                  JSObject out=new JSObject();out.put("started",true);out.put("downloadId",existing);call.resolve(out);return;
                              }
                              if(st==DownloadManager.STATUS_SUCCESSFUL){JSObject out=new JSObject();out.put("started",true);out.put("downloadId",existing);call.resolve(out);return;}
                          }}finally{q.close();}}
                      }
                      DownloadManager.Request request=new DownloadManager.Request(Uri.parse(url));
                      request.setTitle("Numelixa update"); request.setDescription("Downloading the latest Numelixa app");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setAllowedOverMetered(true); request.setAllowedOverRoaming(true);
                      request.setDestinationInExternalFilesDir(getContext(),Environment.DIRECTORY_DOWNLOADS,fileName);
                      long id=manager.enqueue(request); saveId(id);
                      JSObject out=new JSObject();out.put("started",true);out.put("downloadId",id);call.resolve(out);
                  }catch(Exception e){call.reject("Unable to start update download",e);}
              }
          
              @PluginMethod public void getDownloadProgress(PluginCall call){
                  JSObject out=new JSObject(); out.put("status","idle");out.put("downloadedBytes",0);out.put("totalBytes",0);out.put("percent",0);out.put("mbDownloaded",0);out.put("mbTotal",0);
                  try{
                      long id=savedId(); if(id<0){call.resolve(out);return;}
                      DownloadManager manager=(DownloadManager)getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      android.database.Cursor c=manager.query(new DownloadManager.Query().setFilterById(id));
                      if(c==null||!c.moveToFirst()){if(c!=null)c.close();call.resolve(out);return;}
                      try{
                          int st=c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                          long got=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                          long total=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                          String status=st==DownloadManager.STATUS_SUCCESSFUL?"completed":st==DownloadManager.STATUS_FAILED?"failed":"downloading";
                          double pct=total>0?Math.min(100.0,(got*100.0)/total):0;
                          out.put("status",status);out.put("downloadedBytes",got);out.put("totalBytes",total);out.put("percent",pct);out.put("mbDownloaded",got/1024.0/1024.0);out.put("mbTotal",total>0?total/1024.0/1024.0:0);
                          call.resolve(out);
                      }finally{c.close();}
                  }catch(Exception e){call.resolve(out);}
              }
          
              @PluginMethod public void openDownloadedApk(PluginCall call){
                  try{
                      long id=savedId(); if(id<0){call.reject("No downloaded update");return;}
                      DownloadManager manager=(DownloadManager)getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      Uri uri=manager.getUriForDownloadedFile(id);
                      if(uri==null){call.reject("Downloaded update file is unavailable");return;}
                      Intent intent=new Intent(Intent.ACTION_VIEW);intent.setDataAndType(uri,"application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getActivity().startActivity(intent);JSObject out=new JSObject();out.put("opened",true);call.resolve(out);
                  }catch(Exception e){call.reject("Unable to open downloaded update",e);}
              }
          }
          JAVA
          cat > android/app/src/main/java/com/numelixa/app/MainActivity.java <<'JAVA'
          package com.numelixa.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState){
                  registerPlugin(NumelixaUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
                  if(Build.VERSION.SDK_INT>=33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7001);
                  }
              }
          }
          JAVA
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("    <application", '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n\\n    <application', 1)
          p.write_text(s)
          PY
      - name: Configure Firebase push messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          
          root_text = root.read_text()
          app_text = app.read_text()
          
          # Capacitor generates the Android project during CI, so Firebase's
          # Google Services plugin must be attached after cap add android.
          if "com.google.gms:google-services:" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(
                  marker,
                  marker + "\n        classpath 'com.google.gms:google-services:4.5.0'",
                  1
              )
          
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          
          root.write_text(root_text)
          app.write_text(app_text)
          PY
          echo "Firebase Android configuration and Google Services plugin installed."
      - name: Generate Numelixa launcher icons
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Numelixa.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Numelixa-Android-test
          path: Numelixa.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest installable APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Numelixa Android App (Latest)
          prerelease: false
          make_latest: true
          files: Numelixa.apk
          generate_release_notes: false

  signed-release:
    name: Build signed production APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
      - name: Install dependencies and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Add Numelixa native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/numelixa/app
          cat > android/app/src/main/java/com/numelixa/app/NumelixaUpdaterPlugin.java <<'JAVA'
          package com.numelixa.app;
          import android.app.DownloadManager;
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Environment;
          import android.provider.Settings;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          
          @CapacitorPlugin(name = "NumelixaUpdater")
          public class NumelixaUpdaterPlugin extends Plugin {
              private static final String PREFS="numelixa_update";
              private static final String DOWNLOAD_ID="download_id";
              private long savedId(){ return getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).getLong(DOWNLOAD_ID,-1); }
              private void saveId(long id){ getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).edit().putLong(DOWNLOAD_ID,id).apply(); }
          
              @PluginMethod public void installApk(PluginCall call) {
                  String url=call.getString("url"); String fileName=call.getString("fileName","Numelixa-update.apk");
                  if(url==null||!url.startsWith("https://")){call.reject("Invalid update URL");return;}
                  try{
                      DownloadManager manager=(DownloadManager)getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      long existing=savedId();
                      if(existing>0){
                          android.database.Cursor q=manager.query(new DownloadManager.Query().setFilterById(existing));
                          if(q!=null){try{if(q.moveToFirst()){
                              int st=q.getInt(q.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                              if(st==DownloadManager.STATUS_RUNNING||st==DownloadManager.STATUS_PENDING||st==DownloadManager.STATUS_PAUSED){
                                  JSObject out=new JSObject();out.put("started",true);out.put("downloadId",existing);call.resolve(out);return;
                              }
                              if(st==DownloadManager.STATUS_SUCCESSFUL){JSObject out=new JSObject();out.put("started",true);out.put("downloadId",existing);call.resolve(out);return;}
                          }}finally{q.close();}}
                      }
                      DownloadManager.Request request=new DownloadManager.Request(Uri.parse(url));
                      request.setTitle("Numelixa update"); request.setDescription("Downloading the latest Numelixa app");
                      request.setMimeType("application/vnd.android.package-archive");
                      request.setNotificationVisibility(DownloadManager.Request.VISIBILITY_VISIBLE_NOTIFY_COMPLETED);
                      request.setAllowedOverMetered(true); request.setAllowedOverRoaming(true);
                      request.setDestinationInExternalFilesDir(getContext(),Environment.DIRECTORY_DOWNLOADS,fileName);
                      long id=manager.enqueue(request); saveId(id);
                      JSObject out=new JSObject();out.put("started",true);out.put("downloadId",id);call.resolve(out);
                  }catch(Exception e){call.reject("Unable to start update download",e);}
              }
          
              @PluginMethod public void getDownloadProgress(PluginCall call){
                  JSObject out=new JSObject(); out.put("status","idle");out.put("downloadedBytes",0);out.put("totalBytes",0);out.put("percent",0);out.put("mbDownloaded",0);out.put("mbTotal",0);
                  try{
                      long id=savedId(); if(id<0){call.resolve(out);return;}
                      DownloadManager manager=(DownloadManager)getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      android.database.Cursor c=manager.query(new DownloadManager.Query().setFilterById(id));
                      if(c==null||!c.moveToFirst()){if(c!=null)c.close();call.resolve(out);return;}
                      try{
                          int st=c.getInt(c.getColumnIndexOrThrow(DownloadManager.COLUMN_STATUS));
                          long got=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_BYTES_DOWNLOADED_SO_FAR));
                          long total=c.getLong(c.getColumnIndexOrThrow(DownloadManager.COLUMN_TOTAL_SIZE_BYTES));
                          String status=st==DownloadManager.STATUS_SUCCESSFUL?"completed":st==DownloadManager.STATUS_FAILED?"failed":"downloading";
                          double pct=total>0?Math.min(100.0,(got*100.0)/total):0;
                          out.put("status",status);out.put("downloadedBytes",got);out.put("totalBytes",total);out.put("percent",pct);out.put("mbDownloaded",got/1024.0/1024.0);out.put("mbTotal",total>0?total/1024.0/1024.0:0);
                          call.resolve(out);
                      }finally{c.close();}
                  }catch(Exception e){call.resolve(out);}
              }
          
              @PluginMethod public void openDownloadedApk(PluginCall call){
                  try{
                      long id=savedId(); if(id<0){call.reject("No downloaded update");return;}
                      DownloadManager manager=(DownloadManager)getContext().getSystemService(Context.DOWNLOAD_SERVICE);
                      Uri uri=manager.getUriForDownloadedFile(id);
                      if(uri==null){call.reject("Downloaded update file is unavailable");return;}
                      Intent intent=new Intent(Intent.ACTION_VIEW);intent.setDataAndType(uri,"application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_GRANT_READ_URI_PERMISSION);
                      getActivity().startActivity(intent);JSObject out=new JSObject();out.put("opened",true);call.resolve(out);
                  }catch(Exception e){call.reject("Unable to open downloaded update",e);}
              }
          }
          JAVA
          cat > android/app/src/main/java/com/numelixa/app/MainActivity.java <<'JAVA'
          package com.numelixa.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState){
                  registerPlugin(NumelixaUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
                  if(Build.VERSION.SDK_INT>=33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7001);
                  }
              }
          }
          JAVA
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("    <application","    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\n\n    <application",1)
          p.write_text(s)
          PY
      - name: Configure Firebase push messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          root_text = root.read_text()
          app_text = app.read_text()
          
          if "com.google.gms:google-services:" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(
                  marker,
                  marker + "\n        classpath 'com.google.gms:google-services:4.5.0'",
                  1
              )
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          
          root.write_text(root_text)
          app.write_text(app_text)
          PY
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/numelixa-release.jks
          cat >> android/gradle.properties <<EOF
          NUMELIXA_STORE_FILE=../numelixa-release.jks
          NUMELIXA_KEY_ALIAS=$KEY_ALIAS
          NUMELIXA_STORE_PASSWORD=$KEYSTORE_PASSWORD
          NUMELIXA_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          block = """    signingConfigs {
                  release {
                      storeFile file(project.property("NUMELIXA_STORE_FILE"))
                      storePassword project.property("NUMELIXA_STORE_PASSWORD")
                      keyAlias project.property("NUMELIXA_KEY_ALIAS")
                      keyPassword project.property("NUMELIXA_KEY_PASSWORD")
                  }
              }

          """
          if marker not in s:
              raise SystemExit("Could not locate Android buildTypes for release signing")
          s = s.replace(marker, block + marker, 1)
          s = s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Rename release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Numelixa.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: Numelixa Android ${{ github.ref_name }}
          files: Numelixa.apk
          generate_release_notes: true
