          public class NumelixaUpdateService extends Service{
           private static final String P="numelixa_update",CH="numelixa_update";private static final int ID=4207;
           public void onCreate(){super.onCreate();if(Build.VERSION.SDK_INT>=26){NotificationChannel c=new NotificationChannel(CH,"Numelixa updates",NotificationManager.IMPORTANCE_LOW);getSystemService(NotificationManager.class).createNotificationChannel(c);}}
