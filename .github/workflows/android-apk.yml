name: Numelixa Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Generate Numelixa launcher icons
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Numelixa.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Numelixa-Android-test
          path: Numelixa.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest installable APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Numelixa Android App (Latest)
          prerelease: false
          make_latest: true
          files: Numelixa.apk
          generate_release_notes: false

  signed-release:
    name: Build signed production APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
      - name: Install dependencies and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/numelixa-release.jks
          cat >> android/gradle.properties <<EOF
          NUMELIXA_STORE_FILE=../numelixa-release.jks
          NUMELIXA_KEY_ALIAS=$KEY_ALIAS
          NUMELIXA_STORE_PASSWORD=$KEYSTORE_PASSWORD
          NUMELIXA_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          block = """    signingConfigs {
                  release {
                      storeFile file(project.property("NUMELIXA_STORE_FILE"))
                      storePassword project.property("NUMELIXA_STORE_PASSWORD")
                      keyAlias project.property("NUMELIXA_KEY_ALIAS")
                      keyPassword project.property("NUMELIXA_KEY_PASSWORD")
                  }
              }

          """
          if marker not in s:
              raise SystemExit("Could not locate Android buildTypes for release signing")
          s = s.replace(marker, block + marker, 1)
          s = s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          PY
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Rename release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Numelixa.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: Numelixa Android ${{ github.ref_name }}
          files: Numelixa.apk
          generate_release_notes: true
