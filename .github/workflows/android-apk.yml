name: Numelixa Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  debug-apk:
    name: Build installable test APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm install
      - name: Generate Android project and sync
        run: |
          npx cap add android
          npx cap sync android
      - name: Add Numelixa native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/numelixa/app
          cat > android/app/src/main/java/com/numelixa/app/NumelixaUpdaterPlugin.java <<'JAVA'
          package com.numelixa.app;
          
          import android.content.Context;
          import android.content.Intent;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Environment;
          import android.provider.Settings;
          import androidx.core.content.FileProvider;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.*;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;
          
          @CapacitorPlugin(name = "NumelixaUpdater")
          public class NumelixaUpdaterPlugin extends Plugin {
              private static final String PREFS="numelixa_update";
              private static final String FILE_NAME="current_file";
              private static final String TOTAL="total_bytes";
              private final ExecutorService executor=Executors.newSingleThreadExecutor();
              private volatile String status="idle";
              private volatile long downloaded=0;
              private volatile long total=0;
              private volatile String error="";
              private File updateFile;
          
              private File file(){
                  if(updateFile==null){
                      String saved=getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).getString(FILE_NAME,null);
                      updateFile=saved!=null?new File(saved):new File(getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS),"Numelixa-update.apk");
                  }
                  return updateFile;
              }
          
              @PluginMethod public void installApk(PluginCall call){
                  String url=call.getString("url");
                  String name=call.getString("fileName","Numelixa-update.apk");
                  Long expectedValue=call.getLong("totalBytes"); long expected=expectedValue==null?0:expectedValue;
                  if(url==null||!url.startsWith("https://")){call.reject("Invalid update URL");return;}
                  if("downloading".equals(status)){JSObject o=new JSObject();o.put("started",true);call.resolve(o);return;}
                  executor.execute(()->{
                      try{
                          File f=new File(getContext().getExternalFilesDir(Environment.DIRECTORY_DOWNLOADS),name);
                          updateFile=f;
                          getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).edit().putString(FILE_NAME,f.getAbsolutePath()).putLong(TOTAL,expected).apply();
                          long existing=f.exists()?f.length():0;
                          HttpURLConnection c=(HttpURLConnection)new URL(url).openConnection();
                          c.setInstanceFollowRedirects(true);
                          c.setConnectTimeout(30000); c.setReadTimeout(60000);
                          c.setRequestProperty("User-Agent","Numelixa-Android");
                          if(existing>0) c.setRequestProperty("Range","bytes="+existing+"-");
                          c.connect();
                          int code=c.getResponseCode();
                          boolean resumed=existing>0 && code==206;
                          if(existing>0 && !resumed){f.delete();existing=0;}
                          long content=c.getContentLengthLong();
                          total=resumed?(existing+Math.max(0,content)):(content>0?content:expected);
                          downloaded=existing;
                          status="downloading"; error="";
                          try(InputStream in=new BufferedInputStream(c.getInputStream()); RandomAccessFile out=new RandomAccessFile(f,"rw")){
                              out.seek(existing);
                              byte[] buf=new byte[1024*1024];
                              int n;
                              while((n=in.read(buf))!=-1){
                                  out.write(buf,0,n); downloaded+=n;
                              }
                          }finally{c.disconnect();}
                          if(total>0 && downloaded!=total) throw new IOException("Downloaded "+downloaded+" bytes but expected "+total+" bytes");
                          status="completed";
                          getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).edit().putLong(TOTAL,downloaded).apply();
                      }catch(Exception e){
                          status="failed"; error=e.getMessage()==null?"Download failed":e.getMessage();
                      }
                  });
                  JSObject o=new JSObject();o.put("started",true);call.resolve(o);
              }
          
              @PluginMethod public void getAppVersion(PluginCall call){
        try{
            android.content.pm.PackageInfo p=getContext().getPackageManager().getPackageInfo(getContext().getPackageName(),0);
            JSObject o=new JSObject(); o.put("version",p.versionName==null?"0.0.0":p.versionName);
            o.put("versionCode",android.os.Build.VERSION.SDK_INT>=28?p.getLongVersionCode():p.versionCode); call.resolve(o);
        }catch(Exception e){call.reject("Unable to read app version",e);}
    }\n\n    @PluginMethod public void getDownloadProgress(PluginCall call){
                  JSObject o=new JSObject();
                  long savedTotal=getContext().getSharedPreferences(PREFS,Context.MODE_PRIVATE).getLong(TOTAL,0);
                  File f=file();
                  if(downloaded<=0 && f.exists()) downloaded=f.length();
                  long t=total>0?total:savedTotal;
                  if(status.equals("idle") && t>0 && downloaded>=t){status="completed";}
                  double pct=t>0?Math.min(100.0,(downloaded*100.0)/t):0;
                  o.put("status",status);o.put("downloadedBytes",downloaded);o.put("totalBytes",t);
                  o.put("percent",pct);o.put("mbDownloaded",downloaded/1024.0/1024.0);o.put("mbTotal",t/1024.0/1024.0);
                  if(!error.isEmpty())o.put("notification",error);
                  call.resolve(o);
              }
          
              @PluginMethod public void openDownloadedApk(PluginCall call){
                  try{
                      File f=file();
                      if(!f.exists()||f.length()<=0){call.reject("Downloaded update file is unavailable");return;}
                      if(Build.VERSION.SDK_INT>=26 && !getContext().getPackageManager().canRequestPackageInstalls()){
                          Intent settings=new Intent(Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,Uri.parse("package:"+getContext().getPackageName()));
                          settings.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);getActivity().startActivity(settings);
                          call.reject("INSTALL_PERMISSION_REQUIRED");return;
                      }
                      Uri uri=FileProvider.getUriForFile(getContext(),getContext().getPackageName()+".fileprovider",f);
                      Intent intent=new Intent(Intent.ACTION_VIEW);intent.setDataAndType(uri,"application/vnd.android.package-archive");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK|Intent.FLAG_GRANT_READ_URI_PERMISSION|Intent.FLAG_GRANT_WRITE_URI_PERMISSION);
                      getActivity().startActivity(intent);
                      JSObject o=new JSObject();o.put("opened",true);call.resolve(o);
                  }catch(Exception e){call.reject("Unable to open downloaded update",e);}
              }
          }
          JAVA
          cat > android/app/src/main/java/com/numelixa/app/MainActivity.java <<'JAVA'
          package com.numelixa.app;
          import android.Manifest;
          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          public class MainActivity extends BridgeActivity {
              @Override public void onCreate(Bundle savedInstanceState){
                  registerPlugin(NumelixaUpdaterPlugin.class);
                  super.onCreate(savedInstanceState);
                  if(Build.VERSION.SDK_INT>=33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)!=PackageManager.PERMISSION_GRANTED){
                      requestPermissions(new String[]{Manifest.permission.POST_NOTIFICATIONS},7001);
                  }
              }
          }
          JAVA
          python - <<'PY'
          from pathlib import Path
          p=Path("android/app/src/main/AndroidManifest.xml"); s=p.read_text()
          if "android.permission.REQUEST_INSTALL_PACKAGES" not in s:
              s=s.replace("    <application", '    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />\\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\\n\\n    <application', 1)
          provider='''\n        <provider\n            android:name="androidx.core.content.FileProvider"\n            android:authorities="${applicationId}.fileprovider"\n            android:exported="false"\n            android:grantUriPermissions="true">\n            <meta-data\n                android:name="android.support.FILE_PROVIDER_PATHS"\n                android:resource="@xml/numelixa_file_paths" />\n        </provider>'''
          if "androidx.core.content.FileProvider" not in s:
              s=s.replace("</application>", provider+"\n    </application>", 1)
          p.write_text(s)
          xml=Path("android/app/src/main/res/xml/numelixa_file_paths.xml")
          xml.parent.mkdir(parents=True, exist_ok=True)
          xml.write_text('''<?xml version="1.0" encoding="utf-8"?>\n<paths xmlns:android="http://schemas.android.com/apk/res/android">\n    <external-files-path name="update_files" path="Download/" />\n</paths>''')
          PY
      - name: Configure Firebase push messaging
        run: |
          cp google-services.json android/app/google-services.json
          python - <<'PY'
          from pathlib import Path
          
          root = Path("android/build.gradle")
          app = Path("android/app/build.gradle")
          
          root_text = root.read_text()
          app_text = app.read_text()
          
          # Capacitor generates the Android project during CI, so Firebase's
          # Google Services plugin must be attached after cap add android.
          if "com.google.gms:google-services:" not in root_text:
              marker = "dependencies {"
              if marker not in root_text:
                  raise SystemExit("Could not locate root Gradle dependencies block")
              root_text = root_text.replace(
                  marker,
                  marker + "\n        classpath 'com.google.gms:google-services:4.5.0'",
                  1
              )
          
          if "com.google.gms.google-services" not in app_text:
              app_text = app_text.rstrip() + "\n\napply plugin: 'com.google.gms.google-services'\n"
          
          root.write_text(root_text)
          app.write_text(app_text)
          PY
          echo "Firebase Android configuration and Google Services plugin installed."
      - name: Generate Numelixa launcher icons
        run: |
          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Prepare downloadable APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Numelixa.apk
      - name: Upload installable test APK
        uses: actions/upload-artifact@v4
        with:
          name: Numelixa-Android-test
          path: Numelixa.apk
          if-no-files-found: error
          retention-days: 14
      - name: Publish latest installable APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Numelixa Android App (Latest)
          prerelease: false
          make_latest: true
          files: Numelixa.apk
          generate_release_notes: false

  signed-release:
    name: Build signed production APK
    if: startsWith(github.ref, 'refs/tags/v')
    needs: debug-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Require Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing ANDROID_KEY_ALIAS repository secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing ANDROID_KEY_PASSWORD repository secret" && exit 1)
      - name: Install dependencies and create Android project
        run: |
          npm install
          npx cap add android
          npx cap sync android
      - name: Add Numelixa native updater bridge
        run: |
          mkdir -p android/app/src/main/java/com/numelixa/app
          cat > android/app/src/main/java/com/numelixa/app/NumelixaUpdaterPlugin.java <<'JAVA'
