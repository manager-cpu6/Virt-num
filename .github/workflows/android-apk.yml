          python -m pip install --quiet pillow
          python scripts/generate-android-icons.py
      - name: Set Android version
        env:
          ANDROID_VERSION_CODE: ${{ github.run_number }}
          ANDROID_VERSION_NAME: ${{ github.ref_name }}
        run: python scripts/set-android-version.py
      - name: Configure release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/numelixa-release.jks
          cat >> android/gradle.properties <<EOF
          NUMELIXA_STORE_FILE=../numelixa-release.jks
          NUMELIXA_KEY_ALIAS=$KEY_ALIAS
          NUMELIXA_STORE_PASSWORD=$KEYSTORE_PASSWORD
          NUMELIXA_KEY_PASSWORD=$KEY_PASSWORD
          EOF
          python - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "    buildTypes {"
          block = """    signingConfigs {
                  release {
                      storeFile file(project.property("NUMELIXA_STORE_FILE"))
                      storePassword project.property("NUMELIXA_STORE_PASSWORD")
                      keyAlias project.property("NUMELIXA_KEY_ALIAS")
                      keyPassword project.property("NUMELIXA_KEY_PASSWORD")
                  }
              }

          """
          if marker not in s:
              raise SystemExit("Could not locate Android buildTypes for release signing")
          s = s.replace(marker, block + marker, 1)
          s = s.replace("buildTypes {\n        release {", "buildTypes {\n        release {\n            signingConfig signingConfigs.release", 1)
          p.write_text(s)
          from pathlib import Path
          x=Path("android/app/src/main/res/xml")
          x.mkdir(parents=True,exist_ok=True)
          Path("android/app/src/main/res/xml/numelixa_file_paths.xml").write_text('''<paths xmlns:android="http://schemas.android.com/apk/res/android">
    <external-files-path name="numelixa_updates" path="Download/" />
</paths>''')
          PY
      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease
      - name: Rename release APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Numelixa.apk
      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          name: Numelixa Android ${{ github.ref_name }}
          files: Numelixa.apk
          generate_release_notes: true
