name: Numelixa Web Build

on:
  push:
    branches: [main, feat/numelixa-product-preservation-updates, redesign/complete-auth-services-push, feat/mobile-api-sessions-commerce, support-chat-upgrade, support-chat-hardening, android-1.0.8-update-metadata, feat/numelixa-liquid-wallet-receipts-2026, feat/numelixa-liquid-glass-refresh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit installed production dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/numelixa-npm-audit.json || true
          node -e "const a=require('/tmp/numelixa-npm-audit.json'); const m=a.metadata?.vulnerabilities||{}; console.log('npm audit summary:',JSON.stringify(m)); for(const [name,item] of Object.entries(a.vulnerabilities||{})){console.log(name, 'severity='+item.severity, 'direct='+item.isDirect, 'range='+item.range, 'fixAvailable='+JSON.stringify(item.fixAvailable));}"
      - name: Lint
        run: npm run lint --if-present
      - name: Type check
        run: npx tsc --noEmit --pretty false
      - name: Production build
        run: npm run build
