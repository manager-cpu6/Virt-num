name: Numelixa Web Build

on:
  push:
    branches: [main, redesign/complete-auth-services-push, feat/mobile-api-sessions-commerce, support-chat-upgrade, support-chat-hardening, android-1.0.8-update-metadata, feat/numelixa-liquid-wallet-receipts-2026, feat/numelixa-liquid-glass-refresh]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Persist deterministic npm lockfile
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "Add reproducible npm lockfile"
            git push origin HEAD:main
          fi
      - name: Audit installed production dependencies
        shell: bash
        run: |
          npm audit --json > /tmp/numelixa-npm-audit.json || true
          node -e "const a=require('/tmp/numelixa-npm-audit.json'); const m=a.metadata?.vulnerabilities||{}; console.log('npm audit summary:',JSON.stringify(m)); for(const [name,item] of Object.entries(a.vulnerabilities||{})){console.log(name, 'severity='+item.severity, 'direct='+item.isDirect, 'range='+item.range, 'fixAvailable='+JSON.stringify(item.fixAvailable));}"
      - name: Production build
        run: npm run build
