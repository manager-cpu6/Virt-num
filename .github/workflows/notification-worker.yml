name: Numelixa notification worker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-notifications:
    runs-on: ubuntu-latest
    steps:
      - name: Run SMS notification worker
        env:
          CRON_SECRET: ${{ secrets.NUMELIXA_CRON_SECRET }}
        run: |
          test -n "$CRON_SECRET" || { echo "Missing GitHub secret NUMELIXA_CRON_SECRET"; exit 1; }
          curl --fail --silent --show-error --max-time 45             -H "Authorization: Bearer $CRON_SECRET"             https://numelixa.com/api/cron/notifications
          echo
